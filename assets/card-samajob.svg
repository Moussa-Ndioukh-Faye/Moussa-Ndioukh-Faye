<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
<defs>
<style>@font-face{font-family:I;src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}text{font-family:I,'Segoe UI',Helvetica,Arial,sans-serif}
.up{animation:up .9s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.arc{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.33,1,.68,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.up,.arc,.in{animation:none!important;stroke-dashoffset:0}}

.in{animation:in 1s cubic-bezier(.16,1,.3,1) 0.00s both}
@keyframes in{from{opacity:0;transform:translateY(26px)}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16296b"/><stop offset=".6" stop-color="#0b1a48"/><stop offset="1" stop-color="#07123a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
<radialGradient id="ic" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#6aa2ff"/><stop offset=".55" stop-color="#1667f2"/><stop offset="1" stop-color="#0d3fb0"/></radialGradient>
<radialGradient id="gl" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#3b82ff" stop-opacity=".28"/><stop offset="1" stop-color="#3b82ff" stop-opacity="0"/></radialGradient>
</defs>
<g class="in">
<rect x="1" y="1" width="598" height="198" rx="22" fill="url(#bg)"/>
