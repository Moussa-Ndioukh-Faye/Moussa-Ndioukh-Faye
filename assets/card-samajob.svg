<rect x="28" y="30" width="76" height="76" rx="22" fill="url(#ic)"/>
<svg x="46" y="48" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
<text x="128" y="60" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-.6">SamaJob</text>
