<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
<defs>
<style>@font-face{font-family:I;src:url(data:font/woff2;base64,) format('woff2');font-weight:100 900}text{font-family:I,'Segoe UI',Helvetica,Arial,sans-serif}
.up{animation:up .9s cubic-bezier(.16,1,.3,1) both}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
.arc{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.6s cubic-bezier(.33,1,.68,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.up,.arc,.in{animation:none!important;stroke-dashoffset:0}}

.in{animation:in 1s cubic-bezier(.16,1,.3,1) 0.12s both}
@keyframes in{from{opacity:0;transform:translateY(26px)}}
</style>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16296b"/><stop offset=".6" stop-color="#0b1a48"/><stop offset="1" stop-color="#07123a"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
<radialGradient id="ic" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#6aa2ff"/><stop offset=".55" stop-color="#1667f2"/><stop offset="1" stop-color="#0d3fb0"/></radialGradient>
<radialGradient id="gl" cx="1" cy="0" r=".7"><stop offset="0" stop-color="#3b82ff" stop-opacity=".28"/><stop offset="1" stop-color="#3b82ff" stop-opacity="0"/></radialGradient>
</defs>
<g class="in">
<rect x="1" y="1" width="598" height="198" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="598" height="198" rx="22" fill="url(#gl)"/>
<rect x="1.75" y="1.75" width="596.5" height="196.5" rx="21.25" fill="none" stroke="url(#edge)" stroke-width="1.5"/>
<rect x="28" y="30" width="76" height="76" rx="22" fill="url(#ic)"/>
<svg x="46" y="48" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
<text x="128" y="60" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-.6">NIO FAR</text>
<rect x="451" y="32" width="121" height="26" rx="13" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".2"/>
<text x="511" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#8fb0ff" letter-spacing="1.2">TEMPS RÉEL</text>
<text x="128" y="92" font-size="15.5" font-weight="500" fill="#b9c8f5">Jeux multijoueurs en temps réel</text>
<text x="128" y="115" font-size="15.5" font-weight="500" fill="#b9c8f5">pour couples à distance.</text>
<rect x="128" y="150" width="63" height="28" rx="14" fill="#3b82ff" fill-opacity=".16" stroke="#3b82ff" stroke-opacity=".35"/><text x="159" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#a9c4ff">React</text><rect x="199" y="150" width="95" height="28" rx="14" fill="#3b82ff" fill-opacity=".16" stroke="#3b82ff" stroke-opacity=".35"/><text x="246" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#a9c4ff">TypeScript</text><rect x="302" y="150" width="88" height="28" rx="14" fill="#3b82ff" fill-opacity=".16" stroke="#3b82ff" stroke-opacity=".35"/><text x="346" y="169" text-anchor="middle" font-size="14" font-weight="600" fill="#a9c4ff">Socket.IO</text>
</g>
</svg>